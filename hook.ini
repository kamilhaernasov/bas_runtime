; Конфигурация внешнего скрипта (хука) bas_runtime.
; Лежит отдельно от config.ini и model.ini: скрипт можно менять и обновлять, не трогая настройки
; рантайма и модели.

[hook]
; Включить внешний скрипт. Выключен - рантайм работает как обычно, процесса скрипта нет
enabled = 1
; Режим работы:
; sync  - конвеер ждет, пока скрипт закончит с кадром (не дольше timeout_ms). Разметка того же
;         кадра, но частота кадров режется на время работы скрипта;
; async - ждать не ждем: кадр скрипта уходит в поток, как только будет готов, то есть со сдвигом
;         в один кадр. Частота кадров не падает
mode = async
; Пользовательский скрипт: в нем нужна одна функция draw(frame, detections). Всем остальным -
; разделяемой памятью и ожиданием кадров - занимается обвязка: она ставится рядом с бинарником
; рантайма и подхватывает файл, указанный здесь
script = ./hook_user.py
; Интерпретатор: имя ищется по PATH
python = python3
; Бюджет ожидания скрипта в синхронном режиме, мс: не ответил - в поток идет кадр с камеры
timeout_ms = 50
; Сколько терпим молчание скрипта, прежде чем решить, что он завис, и перезапустить его.
; Импорт cv2 и numpy на этой плате занимает секунды, а рисовать скрипт может и медленно:
; это не повод его убивать. Ставится с запасом
stuck_ms = 2000
; Сколько ждем, пока скрипт поднимется и отметится, что готов к кадрам. Пока он поднимается,
; рантайм кадры ему не считает и не перезапускает его. Не отметился за это время - поднимаем заново
start_ms = 5000
