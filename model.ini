; Конфигурация модели: файл .rknn и разбор его выходов.
; Лежит отдельно от config.ini, чтобы менять модель, не трогая настройки рантайма.
; Якоря и названия классов относятся к самой модели, а не к рантайму: они лежат в файлах
; рядом с .rknn, поэтому здесь задаются только пути до них.

[model]
; Тип модели: выбирает реализацию разбора выходов (см. br_model_create)
; yolov5 - anchor-based голова YOLOv5
type = yolov5
; Путь до модели
path = ./model/yolov5.rknn
; Размер входа модели. Строго должен равняться атрибутам модели при экспорте
width = 640
height = 640
; Путь до файла с названиями классов распознавания модели
labels_path = ./model/coco_80_labels_list.txt
; Путь до файла с якорями модели
; Якоря - заранее заданные прямоугольники определенных размеров и пропорций
; Используются как «шаблоны» для предсказания рамок детекции на изображении.
anchors_path = ./model/anchors_yolov5.txt

[detection]
; Порог уверенности детекции
box_thresh = 0.25
; Порог алгоритма подавления дублирующихся рамок
; YOLO распознает сетками. Из-за перекрытия, один объект может определиться N раз.
; Порог подавления - Если IoU между «главной» и другой рамкой превышает заданный порог, то вторая рамка удаляется как дубликат
; IoU - насколько сильно две рамки (или маски) перекрываются
nms_thresh = 0.45
; Максимальное количество рамок детекции, которые рисуются на кадре
max_detections = 128
