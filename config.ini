; Конфигурация рантайма bas_runtime.

[camera]
; Разрешение кадра с камеры. Трансляция в таком же разрешении
width = 1920
height = 1080
; Идентификатор камеры
id = 0
; Каталог с iq-файлами ISP
path_to_iq_dir = /etc/iqfiles

[venc]
; Кодек потока. Поддерживается только h264
codec = h264
; Размер группы кадров
gop = 30
; Битрейт, бит/с. 0 — рассчитать от разрешения кадра
bitrate = 0

[rtsp]
; Порт RTSP-сервера
port = 554
; Путь потока
path = /live/0
