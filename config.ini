; Конфигурация рантайма bas_runtime.

[camera]
; Разрешение кадра с камеры. Трансляция в таком же разрешении
width = 1920
height = 1080
; Идентификатор камеры
id = 0
; Каталог с iq-файлами ISP
path_to_iq_dir = /etc/iqfiles

[model]
; Разрешение кадра для модели. Строго должно равняться атрибутам модели при экспорте
width = 640
height = 640
; Путь до модели
path = ./model/yolov5.rknn
; Путь до файла с названиями классов распознования модели
labels_path = ./model/coco_80_labels_list.txt
; Путь до файла с якорями модели
; Якоря - заранее заданные прямоугольники определенных размеров и пропорций
; Используются как «шаблоны» для предсказания рамок детекции на изображении.
anchors_path = ./model/anchors_yolov5.txt
; Порог уверенности детекции
box_thresh = 0.25
; Порог алгоритма подавления дублирующихся рамок
; YOLO распознает сетками. Из-за перекрытия, один объект может определиться N раз.
; Порог подавление - Если IoU между «главной» и другой рамкой превышает заданный порог, то вторая рамка удаялется как дубликат
; IoU - насколько сильно две рамки (или маски) перекрываются
nms_thresh = 0.45
; Максимальное количество рамок детекции, которые рисуются на кадре
max_detections = 128

[venc]
; Кодек потока. Поддерживается только h264
codec = h264
; Размер группы кадров
gop = 30
; Битрейт, бит/с. 0 — рассчитать от разрешения кадра
bitrate = 0

[rtsp]
; Порт RTSP-сервера
port = 554
; Путь потока
path = /live/0
