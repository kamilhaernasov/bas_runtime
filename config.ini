; Конфигурация рантайма bas_runtime.

[camera]
; Разрешение кадра с камеры. Трансляция в таком же разрешении
width = 1920
height = 1080
; Идентификатор камеры
id = 0
; Каталог с iq-файлами ISP
path_to_iq_dir = /etc/iqfiles

[model]
; Разрешение кадра для модели. Строго должнно 
width = 640
height = 640
; Путь до модели
path = ./model/yolov5.rknn
; Путь до файла с названиями классов модели
labels_path = ./model/coco_80_labels_list.txt
; Путь до файла с якорями голов модели
anchors_path = ./model/anchors_yolov5.txt
; Порог уверенности детекции и порог подавления пересечений
box_thresh = 0.25
nms_thresh = 0.45

[venc]
; Кодек потока. Поддерживается только h264
codec = h264
; Размер группы кадров
gop = 30
; Битрейт, бит/с. 0 — рассчитать от разрешения кадра
bitrate = 0

[rtsp]
; Порт RTSP-сервера
port = 554
; Путь потока
path = /live/0
